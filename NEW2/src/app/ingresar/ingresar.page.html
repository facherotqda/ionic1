<ion-content [fullscreen]="true" class="ion-padding">

  <ion-header collapse="condense">
    <ion-toolbar>
  <ion-title size="large">Ingresar</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card class="login-card">
    <ion-card-header>
      <ion-card-title>Login</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Correo electrónico</ion-label>
        <ion-input [(ngModel)]="usuario" type="text"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input [(ngModel)]="contrasenia" type="password"></ion-input>
      </ion-item>
      <ion-button expand="full" class="ion-margin-top" (click)="ingresar()">Ingresar</ion-button>

      <!-- Login rápido con avatares -->
      <div style="display: flex; gap: 18px; margin: 18px 0 8px 0; justify-content: center;">
        <div style="display: flex; flex-direction: column; align-items: center;">
          <button (click)="loginRapido('asd1@gmail.com')" style="background: none; border: none; padding: 0; cursor: pointer;">
            <img src="assets/avatars/user1.png" alt="Usuario 1" style="width: 64px; height: 64px; border-radius: 50%; border: 2px solid #3880ff; object-fit: cover; box-shadow: 0 2px 8px #0002;">
          </button>
          <span style="font-size: 0.9em; margin-top: 6px; color: #444;">Usuario 1</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center;">
          <button (click)="loginRapido('asd2@gmail.com')" style="background: none; border: none; padding: 0; cursor: pointer;">
            <img src="assets/avatars/user2.png" alt="Usuario 2" style="width: 64px; height: 64px; border-radius: 50%; border: 2px solid #3880ff; object-fit: cover; box-shadow: 0 2px 8px #0002;">
          </button>
          <span style="font-size: 0.9em; margin-top: 6px; color: #444;">Usuario 2</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center;">
          <button (click)="loginRapido('asd3@gmail.com')" style="background: none; border: none; padding: 0; cursor: pointer;">
            <img src="assets/avatars/user3.png" alt="Usuario 3" style="width: 64px; height: 64px; border-radius: 50%; border: 2px solid #3880ff; object-fit: cover; box-shadow: 0 2px 8px #0002;">
          </button>
          <span style="font-size: 0.9em; margin-top: 6px; color: #444;">Usuario 3</span>
        </div>
      </div>

      <div style="margin-top: 2rem; text-align: center;">
        <ion-label color="medium">¿Aún no tiene usuario?</ion-label>
        <br />
        <ion-button color="primary" fill="outline" (click)="goRegistrar()">Registrar</ion-button>
      </div>
    </ion-card-content>
  </ion-card>


</ion-content>
