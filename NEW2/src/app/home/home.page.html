


<ion-header>
  <ion-toolbar>
    <ion-title size="large">INICIO</ion-title>
    <ion-buttons slot="end">
      <ion-button color="danger" (click)="cerrarSesion()">
        <ion-icon name="log-out-outline"></ion-icon>
        <span style="margin-left:6px; font-weight:500;">Cerrar sesión</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="empty-home">
    <ion-label style="font-size:1.2em; font-weight:bold; margin-bottom:8px; display:block;">
      {{ usuarioActual?.nombre || '' }} {{ usuarioActual?.apellido || '' }}
    </ion-label>
    <ion-label style="font-size:1em; color:#666; margin-bottom:16px; display:block;">
      {{ usuarioActual?.email || '' }}
    </ion-label>
    <p>Esta es la página de inicio.</p>
  </div>
</ion-content>
